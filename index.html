    <style>
        :root {
            --bg-color: #fdf6f6;
            --envelope-color: #f4dcd6;
            --envelope-flap: #ebd0c9;
            --envelope-shadow: rgba(180, 120, 120, 0.25);
            --wax-color: #b84a55;
            --paper-color: #fffdfa;
            --text-color: #4a3b3c;
            --accent-color: #b84a55;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center, #fff9f9 0%, #f7e6e6 100%);
            font-family: 'Cormorant Garamond', serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Pétalas / Partículas flutuantes */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            background: rgba(219, 138, 147, 0.35);
            border-radius: 150% 0 150% 0;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Container do Envelope */
        .stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .hint-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #9e7b7d;
            margin-bottom: 30px;
            animation: pulse 2.5s infinite;
            text-align: center;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-3px); }
        }

        .envelope-wrapper {
            position: relative;
            width: 300px;
            height: 200px;
            background: var(--envelope-color);
            border-radius: 6px;
            box-shadow: 0 15px 35px var(--envelope-shadow);
            cursor: pointer;
            transition: transform 0.4s ease;
        }

        .envelope-wrapper:hover {
            transform: scale(1.03);
        }

        /* Aba superior do envelope */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 115px solid var(--envelope-flap);
            transform-origin: top;
            transition: transform 0.7s ease-in-out;
            z-index: 4;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06));
        }

        /* Corpo frontal do envelope */
        .pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid #f7e3de;
            border-right: 150px solid #f2d7d0;
            border-bottom: 105px solid #eed0c8;
            border-top: 95px solid transparent;
            border-radius: 0 0 6px 6px;
            z-index: 3;
        }

        /* Selo de cera */
        .wax-seal {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 48px;
            background: radial-gradient(circle at 30% 30%, #d45d69, var(--wax-color));
            border-radius: 50%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(130, 35, 45, 0.4), inset 0 2px 4px rgba(255,255,255,0.3);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .wax-seal span {
            color: #fce8ea;
            font-size: 20px;
            line-height: 1;
        }

        /* Animação de abertura */
        .envelope-wrapper.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-wrapper.open .wax-seal {
            opacity: 0;
            transform: translateX(-50%) scale(0.7);
        }

        /* Carta Aberta */
        .letter-container {
            display: none;
            opacity: 0;
            width: 100%;
            max-width: 540px;
            background: var(--paper-color);
            padding: 45px 35px;
            border-radius: 8px;
            box-shadow: 0 15px 45px rgba(160, 110, 115, 0.18);
            position: relative;
            z-index: 20;
            transform: translateY(25px);
            transition: opacity 1.2s ease, transform 1.2s ease;
            border: 1px solid rgba(220, 190, 190, 0.4);
        }

        .letter-container.visible {
            opacity: 1;
            transform: translateY(0);
        }
